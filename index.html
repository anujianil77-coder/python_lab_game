<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Lab — Learn, Code, Build</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>🐍 Python Lab <small>Learn, Code, Build</small></h1>
  <div class="stats"><span id="xp">0 XP</span><div class="bar"><div id="bar"></div></div><span id="pct"></span><span id="badges"></span></div>
</header>
<div id="loading">⏳ Loading Python… (first load takes a few seconds)</div>
<nav id="tabs"></nav>
<main>
  <section id="panel"></section>
  <section id="work">
    <h3 id="task-title">Free coding</h3>
    <textarea id="editor"></textarea>
    <details open><summary>Program input (one line for each input() call)</summary><textarea id="stdin" rows="3" spellcheck="false"></textarea></details>
    <div class="btns">
      <button id="run" class="primary">▶ Run</button>
      <button id="check" hidden>✔ Check my solution</button>
      <button id="reset">Reset code</button>
      <button id="clear">Clear output</button>
    </div>
    <pre id="out" aria-live="polite"></pre>
    <div id="feedback"></div>
  </section>
</main>
<footer>Progress is saved only in this browser (localStorage) and does not sync across devices. <button id="wipe">Reset my progress</button></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="data/lessons.js"></script>
<script src="js/progress.js"></script>
<script src="js/python-runner.js"></script>
<script src="js/challenge-engine.js"></script>
<script src="js/lesson-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
